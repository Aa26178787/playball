<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport-fit=cover: iOS safe-area(env) 전달 — 없으면 viewPadding=0이라
       플로팅탭이 홈 인디케이터에 깔리고 노치 영역 침범 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="KBO 야구 라이브 - PlayBall">

  <!-- iOS meta tags & icons -->
  <!-- ⚠️ standalone(전체화면 PWA) 비활성: iOS standalone WebView는 Safari 탭보다
       WebGL/플랫폼뷰 제약이 심해 홈 진입 즉시 렌더러 크래시("문제 반복 발생").
       홈 아이콘 → Safari로 열리게 함 (주소창 노출 트레이드오프, 출시 전 임시) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlayBall">
  <meta name="theme-color" content="#111113">
  <!-- ⚠️ color-scheme: 초기 페인트용 정적값(Flutter 마운트 전 OS 추종). 미선언 시 Chrome
       Auto Dark Theme가 콘텐츠 강제 darkening → 팀로고/선수이미지 어두워짐(06-14 사고).
       ⚠️ Flutter 마운트 후 main.dart `setWebColorScheme`이 **resolved 앱테마**로 override
       (앱=라이트→'light', 앱=다크→'dark'). 정적 'light dark'만 두면 OS 다크 시 브라우저가
       다크 적용해 **라이트모드 앱서도 이미지 어두워짐** — 그래서 동적 추종 필수. -->
  <meta name="color-scheme" content="light dark">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>playball</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- flutter_inappwebview_web 등록 크래시 회피 shim — 웹은 카카오맵 미지원이나
       플러그인이 시작 시 자동 등록되며 window.flutter_inappwebview.nativeCommunication에
       써서 undefined 에러→흰화면. 빈 객체 선주입으로 무해화 (web 전용) -->
  <script>
    // Safari 26이 새로 노출한 ImageDecoder(WebCodecs)가 PNG에 "EncodingError:
    // Loading error."를 던져 Flutter 엔진 이미지 디코드가 전멸 (imgtest로 확정:
    // createImageBitmap 경로는 정상). API를 숨겨 엔진을 검증된 폴백으로 강제.
    if (/^((?!chrome|android).)*safari/i.test(navigator.userAgent)) {
      try { delete window.ImageDecoder; } catch (e) {}
      try { if (window.ImageDecoder) window.ImageDecoder = undefined; } catch (e) {}
      // Safari 26: DOM에 미부착(detached) <img>의 decode()가 EncodingError
      // "Loading error."로 거부됨 — Flutter 엔진이 정확히 detached img+decode()를
      // 사용해 전 이미지 미표시. detached일 때만 load 이벤트 기반으로 대체.
      try {
        const origDecode = HTMLImageElement.prototype.decode;
        HTMLImageElement.prototype.decode = function () {
          if (this.isConnected) return origDecode.call(this);
          const img = this;
          return new Promise(function (resolve, reject) {
            if (img.complete && img.naturalWidth > 0) return resolve();
            if (img.complete) return reject(new DOMException('Loading error.', 'EncodingError'));
            const cleanup = function () {
              img.removeEventListener('load', onLoad);
              img.removeEventListener('error', onError);
            };
            const onLoad = function () { cleanup(); resolve(); };
            const onError = function () {
              cleanup(); reject(new DOMException('Loading error.', 'EncodingError'));
            };
            img.addEventListener('load', onLoad);
            img.addEventListener('error', onError);
          });
        };
      } catch (e) {}
    }
    window.flutter_inappwebview = window.flutter_inappwebview || {};
    // 기존(깨진) 서비스워커 등록 해제 — 베타 중 캐시 누적 방지
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        for (const r of rs) r.unregister();
      });
    }
  </script>
  <!-- CanvasKit 로컬 로드는 빌드 플래그 --no-web-resources-cdn로 처리 (gstatic 차단/iOS 흰화면 회피) -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
