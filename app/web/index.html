<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport-fit=cover: iOS safe-area(env) 전달 — 없으면 viewPadding=0이라
       플로팅탭이 홈 인디케이터에 깔리고 노치 영역 침범 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="KBO 야구 라이브 - PlayBall">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent = 상태바를 앱 배경(다크)에 녹임 (기본 파란 바 제거) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlayBall">
  <meta name="theme-color" content="#111113">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>playball</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- flutter_inappwebview_web 등록 크래시 회피 shim — 웹은 카카오맵 미지원이나
       플러그인이 시작 시 자동 등록되며 window.flutter_inappwebview.nativeCommunication에
       써서 undefined 에러→흰화면. 빈 객체 선주입으로 무해화 (web 전용) -->
  <script>
    window.flutter_inappwebview = window.flutter_inappwebview || {};
    // 기존(깨진) 서비스워커 등록 해제 — 베타 중 캐시 누적 방지
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        for (const r of rs) r.unregister();
      });
    }
  </script>
  <!-- CanvasKit 로컬 로드는 빌드 플래그 --no-web-resources-cdn로 처리 (gstatic 차단/iOS 흰화면 회피) -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
