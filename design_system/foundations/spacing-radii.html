<!-- @dsCard group="Spacing" name="간격 & 라운드 (Space/Radii)" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>간격 & 라운드 (Space/Radii)</title>
<style>
  :root { font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  body { margin: 0; padding: 24px; background: #fafafa; color: #111113; }
  h1 { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
  p.sub { font-size: 12px; color: #6b6b73; margin: 0 0 20px; }
  .grp { font-size: 11px; font-weight: 700; color: #6b6b73; margin: 18px 0 10px; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .tok { width: 92px; font-size: 11px; font-family: ui-monospace, monospace; color: #6b6b73; flex: none; }
  .bar { height: 14px; background: #1976D2; border-radius: 3px; }
  .rgrid { display: flex; flex-wrap: wrap; gap: 16px; }
  .rcell { text-align: center; }
  .rbox { width: 64px; height: 64px; background: #1976D2; border: 1px solid rgba(0,0,0,.1); }
  .rlbl { font-size: 11px; font-family: ui-monospace, monospace; color: #6b6b73; margin-top: 6px; }
</style>
</head>
<body>
  <h1>간격 & 라운드 — Space / Radii</h1>
  <p class="sub">design_tokens.dart · EdgeInsets·SizedBox / BorderRadius 통일 scale</p>

  <div class="grp">Space (간격 px)</div>
  <div class="srow"><span class="tok">xs 4</span><span class="bar" style="width:4px"></span></div>
  <div class="srow"><span class="tok">sm 8</span><span class="bar" style="width:8px"></span></div>
  <div class="srow"><span class="tok">md 12</span><span class="bar" style="width:12px"></span></div>
  <div class="srow"><span class="tok">lg 16</span><span class="bar" style="width:16px"></span></div>
  <div class="srow"><span class="tok">xl 24</span><span class="bar" style="width:24px"></span></div>
  <div class="srow"><span class="tok">xxl 32</span><span class="bar" style="width:32px"></span></div>

  <div class="grp">Radii (모서리 반경 px)</div>
  <div class="rgrid">
    <div class="rcell"><div class="rbox" style="border-radius:4px"></div><div class="rlbl">xs 4</div></div>
    <div class="rcell"><div class="rbox" style="border-radius:8px"></div><div class="rlbl">sm 8</div></div>
    <div class="rcell"><div class="rbox" style="border-radius:12px"></div><div class="rlbl">md 12</div></div>
    <div class="rcell"><div class="rbox" style="border-radius:16px"></div><div class="rlbl">lg 16</div></div>
    <div class="rcell"><div class="rbox" style="border-radius:20px"></div><div class="rlbl">xl 20</div></div>
    <div class="rcell"><div class="rbox" style="border-radius:999px"></div><div class="rlbl">pill 999</div></div>
  </div>
</body>
</html>
