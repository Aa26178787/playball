# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# 이미지 프록시: 브라우저 캐시버스터 _cb 를 upstream(pstatic) 전달 전 제거.
# (pstatic은 _cb 단독 쿼리에 404 — 선수사진엔 type 파라미터 없음)
map $args $ni_clean_args {
    default                            $args;
    "~^_cb=[^&]*$"                     "";
    "~^_cb=[^&]*&(?<rest>.+)$"          $rest;
    "~^(?<head>.+)&_cb=[^&]*$"          $head;
    "~^(?<h2>.+)&_cb=[^&]*&(?<t2>.+)$"  "$h2&$t2";
}

server {
    listen 80;
    server_name playball.duckdns.org;

    # ACME challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # All other HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name playball.duckdns.org;

    # SSL certs (certbot fills these)
    ssl_certificate     /etc/letsencrypt/live/playball.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playball.duckdns.org/privkey.pem;

    # TLS 1.2+ only, strong ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 법무 HTML(inline style, no script)만 nginx가 직접 서빙 → CSP로 script 차단. API JSON·Flutter 앱은 CSP 무영향
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    server_tokens off;

    # Static files (profile images, post images)
    location /static/ {
        alias /home/ubuntu/playball/backend/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Flutter web PWA 베타 (지인용 — iOS 맛보기). /app/ 하위 SPA 라우팅
    # ⚠️ location add_header는 server 블록 헤더를 전부 덮음 → 보안헤더 재선언 필수.
    #    Flutter는 인라인 스크립트+wasm-eval 필요, 이미지/API는 playball 도메인(self)
    location /app/ {
        # PWA 셸 갱신 보장 — Cache-Control 없으면 Safari 휴리스틱 캐시가 옛 빌드 영구 재생
        add_header Cache-Control "no-cache" always;
        alias /var/www/playball_web/;
        try_files $uri $uri/ /app/index.html;
        # location types{}는 전역 mime.types를 덮어씀 → html 등 필수 타입 재선언 필수.
        # .wasm은 반드시 application/wasm (아니면 WebAssembly.compile 거부=흰화면)
        types {
            text/html html htm;
            application/wasm wasm;
            application/javascript js mjs;
            text/css css;
            application/json json manifest;
            image/png png;
            image/x-icon ico;
            image/svg+xml svg;
            font/woff2 woff2;
            font/ttf ttf;
        }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com https://*.googleapis.com https://*.firebaseio.com https://fcmregistrations.googleapis.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" always;
    }
    location = /app { return 301 /app/; }

    # /app2/ = wasm(skwasm) 실험 트랙 — COOP/COEP로 cross-origin isolation
    # (SharedArrayBuffer → 멀티스레드 렌더러). 검증 후 본판 승격 여부 결정.
    location /app2/ {
        add_header Cache-Control "no-cache" always;
        alias /var/www/playball_web2/;
        try_files $uri $uri/ /app2/index.html;
        types {
            text/html html htm;
            application/wasm wasm;
            application/javascript js mjs;
            text/css css;
            application/json json manifest;
            image/png png;
            image/x-icon ico;
            image/svg+xml svg;
            font/woff2 woff2;
            font/ttf ttf;
        }
        default_type application/octet-stream;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com https://*.googleapis.com https://*.firebaseio.com https://fcmregistrations.googleapis.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" always;
    }
    location = /app2 { return 301 /app2/; }

    # 네이버 이미지 프록시 — Flutter web CanvasKit는 외부 CORS 없는 이미지 렌더 불가.
    # pstatic은 ACAO 미제공 → 같은 도메인 경유로 우회 (web 전용, 앱은 직접 로드).
    # /ni/<host>/<path> → https://<host>/<path>  (host는 pstatic 계열만 허용)
    location ~ ^/ni/(sports-phinf\.pstatic\.net|phinf\.pstatic\.net|ssl\.pstatic\.net|upload\.wikimedia\.org)/(.*)$ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        set $up_host $1;
        set $up_path $2;
        # _cb 제거한 쿼리로 upstream 호출 (빈 쿼리면 ? 생략)
        set $ni_q "";
        if ($ni_clean_args) { set $ni_q "?$ni_clean_args"; }
        proxy_pass https://$up_host/$up_path$ni_q;
        proxy_set_header Host $up_host;
        # pstatic은 Origin/Referer 있으면 403(hotlink 방지) → upstream엔 제거하고 네이버 Referer 위장
        proxy_set_header Origin "";
        proxy_set_header Referer "https://sports.naver.com/";
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=604800" always;
        proxy_cache_valid 200 7d;
    }

    # Legal pages (privacy policy / terms) — Play Console & in-app links
    location = /privacy {
        alias /home/ubuntu/playball/backend/static/legal/privacy.html;
        default_type text/html;
        charset utf-8;
    }
    location = /terms {
        alias /home/ubuntu/playball/backend/static/legal/terms.html;
        default_type text/html;
        charset utf-8;
    }

    # Auth endpoints — strict rate limit
    location ~ ^/auth/(login|register|password) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — general rate limit
    location / {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
