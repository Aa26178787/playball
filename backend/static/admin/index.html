<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PlayBall Admin</title>
<style>
  :root { --bg:#111113; --paper:#18181C; --paper2:#1F1F24; --line:#26262C;
          --ink:#F4F4F5; --sub:#9A9AA3; --red:#F43F5E; --green:#4ADE80; --amber:#FBBF24; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink);
         font:14px/1.5 'Pretendard','Apple SD Gothic Neo',sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px;
           border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); }
  header h1 { font-size:16px; }
  header .key { margin-left:auto; display:flex; gap:6px; }
  input, select { background:var(--paper2); border:1px solid var(--line); color:var(--ink);
          border-radius:8px; padding:7px 10px; font-size:13px; }
  button { background:var(--paper2); border:1px solid var(--line); color:var(--ink);
           border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--sub); }
  button.danger { color:var(--red); }
  button.ok { color:var(--green); }
  nav { display:flex; gap:6px; padding:10px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button.active { background:var(--ink); color:#111; font-weight:700; }
  main { padding:16px 20px 60px; max-width:1100px; margin:0 auto; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--sub); font-weight:600; font-size:12px; }
  td.num { font-variant-numeric:tabular-nums; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:14px; }
  .card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card .v { font-size:24px; font-weight:800; margin-top:4px; }
  .card .k { font-size:12px; color:var(--sub); }
  .bar { display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--sub); font-size:12px; }
  .pill { padding:2px 8px; border-radius:99px; font-size:11px; font-weight:700; }
  .pill.r { background:rgba(244,63,94,.15); color:var(--red); }
  .pill.g { background:rgba(74,222,128,.15); color:var(--green); }
  .pill.a { background:rgba(251,191,36,.15); color:var(--amber); }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
           background:var(--paper2); border:1px solid var(--line); padding:10px 18px;
           border-radius:10px; display:none; }
</style>
</head>
<body>
<!-- 로그인 게이트 (06-13) — 키 검증 후에만 콘솔 노출 -->
<div id="login" style="position:fixed; inset:0; background:var(--bg); display:flex;
     align-items:center; justify-content:center; z-index:50;">
  <div style="text-align:center; width:300px;">
    <div style="font-size:34px; margin-bottom:8px;">⚾</div>
    <h1 style="font-size:20px; margin:0 0 18px;">PlayBall Admin</h1>
    <input id="loginKey" type="password" placeholder="Admin Key"
           style="width:100%; box-sizing:border-box; padding:11px 14px; margin-bottom:10px;"
           onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()" style="width:100%; padding:11px;">접속</button>
    <div id="loginMsg" style="margin-top:10px; font-size:12px; color:var(--amber); min-height:16px;"></div>
  </div>
</div>

<div id="console" style="display:none;">
<header>
  <h1>⚾ PlayBall Admin</h1>
  <div class="key">
    <button onclick="doLogout()">로그아웃</button>
  </div>
</header>
<nav>
  <button data-tab="overview" class="active" onclick="show('overview')">개요</button>
  <button data-tab="stats" onclick="show('stats')">통계</button>
  <button data-tab="users" onclick="show('users')">회원</button>
  <button data-tab="posts" onclick="show('posts')">게시글</button>
  <button data-tab="comments" onclick="show('comments')">댓글</button>
  <button data-tab="reports" onclick="show('reports')">신고</button>
  <button data-tab="food" onclick="show('food')">맛집 승인</button>
  <button data-tab="features" onclick="show('features')">기능 토글</button>
  <button data-tab="config" onclick="show('config')">설정·공지</button>
  <button data-tab="system" onclick="show('system')">시스템</button>
</nav>
<main id="main"></main>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
// 키는 localStorage 보관 — keyEl 호환 셔임 (기존 api()가 keyEl.value 사용)
const keyEl = { get value() { return localStorage.getItem('pb_admin_key') || ''; } };

async function doLogin() {
  const k = $('#loginKey').value.trim();
  if (!k) return;
  $('#loginMsg').textContent = '확인 중…';
  try {
    const r = await fetch('/admin/overview', { headers: { 'X-Admin-Key': k } });
    if (r.status === 403) { $('#loginMsg').textContent = '키가 올바르지 않습니다'; return; }
    if (!r.ok) { $('#loginMsg').textContent = '서버 오류 (' + r.status + ')'; return; }
    localStorage.setItem('pb_admin_key', k);
    enterConsole();
  } catch (e) { $('#loginMsg').textContent = '연결 실패'; }
}
function doLogout() {
  localStorage.removeItem('pb_admin_key');
  $('#console').style.display = 'none';
  $('#login').style.display = 'flex';
  $('#loginKey').value = '';
  $('#loginMsg').textContent = '';
}
function enterConsole() {
  $('#login').style.display = 'none';
  $('#console').style.display = 'block';
  show('overview');
}
// 저장된 키 있으면 자동 검증 후 진입
(async () => {
  const k = localStorage.getItem('pb_admin_key');
  if (!k) return;
  try {
    const r = await fetch('/admin/overview', { headers: { 'X-Admin-Key': k } });
    if (r.ok) enterConsole();
    else localStorage.removeItem('pb_admin_key');
  } catch (e) {}
})();
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block';
                    setTimeout(() => t.style.display = 'none', 2200); }
async function api(method, path, body) {
  const opts = { method, headers: { 'X-Admin-Key': keyEl.value.trim() } };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (res.status === 403) { toast('키가 틀렸습니다'); throw new Error('403'); }
  if (!res.ok) { toast('오류 ' + res.status); throw new Error('' + res.status); }
  return res.json();
}
function esc(s) { return ('' + (s ?? '')).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let cur = 'overview';
function show(tab) {
  cur = tab;
  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));
  ({overview, users, posts, reports, food, features, stats, config, system, comments})[tab]();
}

// ── 통계: DAU/가입 추이 (CSS 바차트) ──
async function stats() {
  const d = await api('GET', '/admin/stats');
  const bar = (rows, color) => {
    if (!rows.length) return '<div class="muted">데이터 없음</div>';
    const max = Math.max(...rows.map(r => r.count), 1);
    return '<div style="display:flex; align-items:flex-end; gap:3px; height:90px;">' +
      rows.map(r => `<div title="${r.date}: ${r.count}" style="flex:1; background:${color};
        height:${Math.max(4, r.count / max * 100)}%; border-radius:2px 2px 0 0;"></div>`).join('') +
      '</div><div class="muted" style="font-size:10px; display:flex; justify-content:space-between;">' +
      `<span>${rows[0].date.slice(5)}</span><span>${rows[rows.length-1].date.slice(5)}</span></div>`;
  };
  $('#main').innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">오늘 DAU</div><div class="v">${(d.dau.at(-1)||{}).count ?? 0}</div></div>
      <div class="card"><div class="k">WAU (7일)</div><div class="v">${d.wau}</div></div>
      <div class="card"><div class="k">MAU (30일)</div><div class="v">${d.mau}</div></div>
      <div class="card"><div class="k">예측 참여</div><div class="v">${d.predictions ?? '-'}</div></div>
      <div class="card"><div class="k">직관 기록</div><div class="v">${d.visits ?? '-'}</div></div>
      <div class="card"><div class="k">게시글</div><div class="v">${d.posts ?? '-'}</div></div>
    </div>
    <h3 style="margin:18px 0 8px;">일별 활성 사용자 (30일)</h3>${bar(d.dau, '#4ade80')}
    <h3 style="margin:18px 0 8px;">일별 가입 (30일)</h3>${bar(d.signups, '#60a5fa')}`;
}

// ── 설정·공지: 배너/버전/시즌 + 공지 푸시 ──
async function config() {
  const d = await api('GET', '/admin/config');
  const c = d.config || {};
  const banner = c.banner || {};
  $('#main').innerHTML = `
    <h3>공지 배너 (홈 상단)</h3>
    <div class="bar" style="flex-wrap:wrap; gap:8px;">
      <input id="bnMsg" placeholder="배너 문구 (비우고 저장=해제)" value="${esc(banner.message||'')}" style="width:320px">
      <select id="bnLv"><option value="info" ${banner.level!=='warn'?'selected':''}>info</option>
        <option value="warn" ${banner.level==='warn'?'selected':''}>warn</option></select>
      <button onclick="saveBanner()">저장</button>
    </div>
    <h3 style="margin-top:20px;">앱 버전</h3>
    <div class="bar" style="gap:8px;">
      <label>최소(강제): <input id="cfgMin" value="${esc(c.min_version||'1.0.0')}" style="width:90px"></label>
      <label>최신(권장): <input id="cfgLatest" value="${esc(c.latest_version||'1.0.0')}" style="width:90px"></label>
      <button onclick="saveVersions()">저장</button>
    </div>
    <h3 style="margin-top:20px;">시즌 단계</h3>
    <div class="bar" style="gap:8px;">
      <select id="cfgPhase">${['preseason','regular','postseason','offseason'].map(p =>
        `<option ${c.season_phase===p?'selected':''}>${p}</option>`).join('')}</select>
      <button onclick="saveCfg('season_phase', $('#cfgPhase').value)">저장</button>
    </div>
    <h3 style="margin-top:24px;">📣 공지 푸시 (전체 발송)</h3>
    <div style="display:flex; flex-direction:column; gap:8px; max-width:420px;">
      <input id="bcTitle" placeholder="제목">
      <textarea id="bcBody" placeholder="내용" rows="3" style="background:var(--paper2);
        border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px 12px;"></textarea>
      <button class="danger" onclick="sendBroadcast()">전체 푸시 발송</button>
    </div>`;
}
async function saveCfg(key, value) { await api('POST', '/admin/config', { key, value }); toast(key + ' 저장됨'); }
async function saveBanner() {
  const msg = $('#bnMsg').value.trim();
  await api('POST', '/admin/config', { key: 'banner',
    value: msg ? { message: msg, level: $('#bnLv').value } : null });
  toast(msg ? '배너 설정됨' : '배너 해제됨');
}
async function saveVersions() {
  await api('POST', '/admin/config', { key: 'min_version', value: $('#cfgMin').value.trim() });
  await api('POST', '/admin/config', { key: 'latest_version', value: $('#cfgLatest').value.trim() });
  toast('버전 저장됨');
}
async function sendBroadcast() {
  const title = $('#bcTitle').value.trim(), body = $('#bcBody').value.trim();
  if (!title || !body) return toast('제목/내용 입력');
  if (!confirm('전체 사용자에게 푸시를 보냅니다.\n"' + title + '"\n계속할까요?')) return;
  const r = await api('POST', '/admin/broadcast', { title, body });
  toast(r.sent_users + '명에게 발송됨');
}

// ── 시스템: 상태보드/재크롤/알림내역/보안로그 ──
async function system() {
  const h = await api('GET', '/admin/health');
  const hb = h.scheduler_heartbeat ? String(h.scheduler_heartbeat).slice(0, 19) : '없음';
  const bk = h.backup_last ? `${h.backup_last.file} (${h.backup_last.size_mb}MB, ${h.backup_last.mtime})` : '없음';
  $('#main').innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">스케줄러 하트비트</div><div class="v" style="font-size:13px;">${hb}</div></div>
      <div class="card"><div class="k">등록말소 최종 수집일</div><div class="v" style="font-size:15px;">${h.roster_crawl_last ?? '-'}</div></div>
      <div class="card"><div class="k">오늘 알림 발송</div><div class="v">${h.notifications_today ?? '-'}</div></div>
      <div class="card"><div class="k">오늘 DAU</div><div class="v">${h.dau_today ?? '-'}</div></div>
    </div>
    <p class="muted">최근 백업: ${esc(bk)}</p>
    <h3 style="margin:16px 0 8px;">수동 작업 (scheduler가 30초 내 실행)</h3>
    <div class="bar" style="gap:8px;">
      <button onclick="runCmd('recrawl_roster')">등록말소 재크롤</button>
      <button onclick="runCmd('recrawl_rankings')">팀순위 재크롤</button>
      <button onclick="runCmd('recrawl_today_games')">오늘 경기 재크롤</button>
    </div>
    <table><tr><th>#</th><th>명령</th><th>상태</th><th>결과</th><th>시각</th></tr>` +
    (h.commands||[]).map(c => `<tr><td>${c.id}</td><td>${c.command}</td>
      <td>${c.status}</td><td>${esc(c.result)}</td><td>${c.at}</td></tr>`).join('') + `</table>
    <h3 style="margin:18px 0 8px;">최근 알림 발송 <button onclick="loadNotifs()" style="font-size:11px;">불러오기</button></h3>
    <div id="notifBox"></div>
    <h3 style="margin:18px 0 8px;">보안 로그 <button onclick="loadSeclog()" style="font-size:11px;">불러오기</button></h3>
    <pre id="seclogBox" style="font-size:11px; background:var(--paper2); padding:10px;
      border-radius:8px; max-height:260px; overflow:auto;"></pre>`;
}
async function runCmd(command) {
  await api('POST', '/admin/commands', { command });
  toast(command + ' 큐 등록 — 30초 내 실행');
  setTimeout(system, 4000);
}
async function loadNotifs() {
  const d = await api('GET', '/admin/notifications?limit=40');
  $('#notifBox').innerHTML = '<table><tr><th>#</th><th>유저</th><th>타입</th><th>제목</th><th>시각</th></tr>' +
    d.notifications.map(n => `<tr><td>${n.id}</td><td>${n.user_id}</td><td>${n.type}</td>
      <td>${esc(n.title)}</td><td>${n.created_at}</td></tr>`).join('') + '</table>';
}
async function loadSeclog() {
  const d = await api('GET', '/admin/seclog?lines=80');
  $('#seclogBox').textContent = d.lines.join('\n') || '(비어 있음)';
}

// ── 댓글 검색/삭제 ──
async function comments(q = '') {
  const d = await api('GET', '/admin/comments?q=' + encodeURIComponent(q));
  $('#main').innerHTML = `
    <div class="bar"><input id="cq" placeholder="댓글 내용 검색" value="${esc(q)}" style="width:240px">
    <button onclick="comments($('#cq').value)">검색</button>
    <span class="muted">${d.comments.length}건</span></div>
    <table><tr><th>#</th><th>내용</th><th>작성자</th><th>글</th><th>시각</th><th></th></tr>` +
    d.comments.map(c => `<tr><td>${c.id}</td><td>${esc(c.content)}</td><td>${esc(c.author)}</td>
      <td>${c.post_id}</td><td>${c.created_at}</td>
      <td><button class="danger" onclick="delComment(${c.id})">삭제</button></td></tr>`).join('') + '</table>';
}
async function delComment(cid) {
  if (!confirm('#' + cid + ' 댓글을 삭제할까요?')) return;
  await api('DELETE', '/admin/comments/' + cid);
  toast('삭제됨'); comments($('#cq') ? $('#cq').value : '');
}

// 기능 킬스위치 — OFF = 앱/웹에서 해당 UI 숨김 (전파 즉시~60초)
async function features() {
  const d = await api('GET', '/admin/feature-flags');
  $('#main').innerHTML = `
    <p class="muted">OFF = 앱/웹에서 해당 기능 숨김. 저장 즉시 서버 반영, 클라이언트는 앱 재시작/새로고침 시 적용.</p>
    <table><tr><th>기능</th><th>상태</th><th></th></tr>` +
    d.features.map(f => `<tr>
      <td>${esc(f.label)}<div class="muted" style="font-size:11px">key: ${f.key}</div></td>
      <td style="font-weight:700;color:${f.enabled ? '#16a34a' : '#dc2626'}">${f.enabled ? 'ON' : 'OFF'}</td>
      <td><button class="${f.enabled ? 'danger' : ''}"
            onclick="toggleFeature('${f.key}', ${!f.enabled})">${f.enabled ? '끄기' : '켜기'}</button></td>
    </tr>`).join('') + `</table>`;
}
async function toggleFeature(key, enabled) {
  if (!enabled && !confirm(key + ' 기능을 끌까요? 앱/웹에서 즉시 숨겨집니다.')) return;
  await api('POST', '/admin/feature-flags', { feature: key, enabled });
  toast(key + (enabled ? ' 켜짐' : ' 꺼짐'));
  features();
}

async function overview() {
  const d = await api('GET', '/admin/overview');
  $('#main').innerHTML = `<div class="cards">` + [
    ['회원', d.users], ['오늘 가입', d.users_today], ['게시글', d.posts],
    ['댓글', d.comments], ['게시글 신고', d.post_reports],
    ['인스타 신고', d.insta_reports], ['맛집 대기', d.food_pending],
    ['푸시 토큰', d.push_tokens],
  ].map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v ?? '-'}</div></div>`).join('') + `</div>`;
}

async function users(q = '') {
  const d = await api('GET', '/admin/users?q=' + encodeURIComponent(q));
  $('#main').innerHTML = `
    <div class="bar"><input id="uq" placeholder="이메일/닉네임 검색" value="${esc(q)}" style="width:240px">
    <button onclick="users($('#uq').value)">검색</button>
    <span class="muted">${d.users.length}명</span></div>
    <table><tr><th>ID</th><th>이메일</th><th>닉네임</th><th>가입일</th><th>인증</th><th>글/댓글</th><th></th></tr>` +
    d.users.map(u => `<tr><td class="num">${u.id}</td><td>${esc(u.email)}</td><td>${esc(u.nickname)}</td>
      <td class="muted">${u.created_at}</td>
      <td>${u.verified ? '<span class="pill g">인증</span>' : '<span class="pill r">미인증</span>'}</td>
      <td class="num">${u.posts}/${u.comments}</td>
      <td style="white-space:nowrap;">
        <button onclick="suspendUser(${u.id}, '${esc(u.nickname)}')">정지</button>
        <button onclick="grantPts(${u.id}, '${esc(u.nickname)}')">포인트</button>
        <button class="danger" onclick="delUser(${u.id}, '${esc(u.nickname)}')">탈퇴</button>
      </td></tr>`).join('') + '</table>';
}
async function delUser(id, nick) {
  if (!confirm(`회원 #${id} ${nick} 를 탈퇴(영구삭제) 처리합니까?\n게시글·댓글·기록이 함께 삭제/익명화됩니다.`)) return;
  await api('DELETE', '/admin/users/' + id); toast('삭제됨'); users($('#uq')?.value || '');
}
async function suspendUser(id, nick) {
  const days = prompt(`#${id} ${nick} 정지 일수 (0 = 해제):`, '7');
  if (days === null) return;
  await api('POST', `/admin/users/${id}/suspend`, { days: parseInt(days, 10) || 0 });
  toast(parseInt(days, 10) > 0 ? days + '일 정지됨' : '정지 해제됨');
}
async function grantPts(id, nick) {
  const pts = prompt(`#${id} ${nick} 지급 포인트 (음수 = 회수):`, '100');
  if (pts === null) return;
  const memo = prompt('사유 메모:', '이벤트 보상') || '';
  await api('POST', '/admin/points', { user_id: id, points: parseInt(pts, 10) || 0, memo });
  toast(pts + 'P 처리됨');
}

async function posts(q = '') {
  const d = await api('GET', '/admin/posts?q=' + encodeURIComponent(q));
  $('#main').innerHTML = `
    <div class="bar"><input id="pq" placeholder="제목/내용 검색" value="${esc(q)}" style="width:240px">
    <button onclick="posts($('#pq').value)">검색</button>
    <span class="muted">${d.posts.length}건</span></div>
    <table><tr><th>ID</th><th>제목</th><th>분류</th><th>작성자</th><th>작성일</th><th>조회/좋아요/댓글</th><th>신고</th><th></th></tr>` +
    d.posts.map(p => `<tr><td class="num">${p.id}</td><td>${esc(p.title)}</td><td>${esc(p.category)}</td>
      <td>${esc(p.nickname)}</td><td class="muted">${p.created_at}</td>
      <td class="num">${p.views}/${p.likes}/${p.comments}</td>
      <td>${p.reports ? `<span class="pill r">${p.reports}</span>` : '-'}</td>
      <td><button onclick="comments(${p.id})">댓글</button>
          <button class="danger" onclick="delPost(${p.id})">삭제</button></td></tr>`).join('') + '</table>';
}
async function delPost(id) {
  if (!confirm(`게시글 #${id} 삭제? (댓글·신고 포함)`)) return;
  await api('DELETE', '/admin/posts/' + id); toast('삭제됨'); posts($('#pq')?.value || '');
}
async function comments(pid) {
  const d = await api('GET', `/admin/posts/${pid}/comments`);
  $('#main').innerHTML = `<div class="bar"><button onclick="posts()">← 게시글 목록</button>
    <span class="muted">게시글 #${pid} 댓글 ${d.comments.length}개</span></div>
    <table><tr><th>ID</th><th>작성자</th><th>내용</th><th>작성일</th><th></th></tr>` +
    d.comments.map(c => `<tr><td class="num">${c.id}</td><td>${esc(c.nickname)}</td>
      <td>${esc(c.content)}</td><td class="muted">${c.created_at}</td>
      <td><button class="danger" onclick="delComment(${c.id}, ${pid})">삭제</button></td></tr>`).join('') + '</table>';
}
async function delComment(id, pid) {
  if (!confirm(`댓글 #${id} 삭제?`)) return;
  await api('DELETE', '/admin/comments/' + id); toast('삭제됨'); comments(pid);
}

async function reports() {
  const d = await api('GET', '/admin/reports');
  $('#main').innerHTML = `
    <h3 style="margin-top:6px">게시글 신고 <span class="muted">${d.post_reports.length}</span></h3>
    <table><tr><th>ID</th><th>게시글</th><th>사유</th><th>신고자</th><th>일시</th><th></th></tr>` +
    d.post_reports.map(r => `<tr><td class="num">${r.id}</td>
      <td>#${r.post_id} ${esc(r.post_title)}</td><td>${esc(r.reason)}</td>
      <td>${esc(r.reporter)}</td><td class="muted">${r.created_at}</td>
      <td><button class="danger" onclick="delPost(${r.post_id})">글 삭제</button>
          <button class="ok" onclick="resolveR('post', ${r.id})">신고만 처리</button></td></tr>`).join('') +
    `</table>
    <h3 style="margin-top:22px">인스타 핸들 신고 <span class="muted">${d.insta_reports.length}</span></h3>
    <table><tr><th>ID</th><th>선수</th><th>신고된 핸들</th><th>일시</th><th></th></tr>` +
    d.insta_reports.map(r => `<tr><td class="num">${r.id}</td>
      <td>#${r.player_id} ${esc(r.player)}</td><td>@${esc(r.handle)}</td>
      <td class="muted">${r.created_at}</td>
      <td><button class="ok" onclick="resolveR('insta', ${r.id})">처리 완료</button></td></tr>`).join('') + '</table>';
}
async function resolveR(kind, id) {
  await api('DELETE', `/admin/reports/${kind}/${id}`); toast('처리됨'); reports();
}

async function food() {
  const d = await api('GET', '/stadiums/food-places/pending');
  const rows = d.places || [];
  $('#main').innerHTML = `<div class="bar"><span class="muted">승인 대기 ${rows.length}건</span></div>
    <table><tr><th>ID</th><th>구장</th><th>이름</th><th>분류</th><th>메모</th><th>추천수</th><th>제안자</th><th>상태</th><th></th></tr>` +
    rows.map(f => `<tr><td class="num">${f.id}</td><td>${esc(f.stadium)}</td>
      <td>${esc(f.name)}</td><td>${esc(f.category ?? '')}</td><td>${esc(f.memo ?? '')}</td>
      <td class="num">${f.upvotes ?? 0}</td><td>${esc(f.submitted_by ?? '')}</td>
      <td><span class="pill a">${esc(f.status)}</span></td>
      <td><button class="ok" onclick="foodAct(${f.id}, 'approve')">승인</button>
          <button class="danger" onclick="foodAct(${f.id}, 'reject')">거절</button></td></tr>`).join('') + '</table>';
}
async function foodAct(id, action) {
  const res = await fetch(`/stadiums/food-places/${id}/admin?action=${action}`, {
    method: 'PUT', headers: { 'X-Admin-Key': keyEl.value.trim() } });
  if (!res.ok) { toast('오류 ' + res.status); return; }
  toast(action === 'approve' ? '승인됨' : '거절됨'); food();
}

if (keyEl.value) show('overview');
</script>
</body>
</html>
