name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true
      - run: flutter pub get
      - name: analyze (lib/test만 — vendored local_packages 제외, 에러만 실패)
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings
      - name: test (골든 제외 — PNG 기준이 Windows 렌더라 Linux 러너와 불일치)
        run: flutter test --exclude-tags golden

  backend:
    name: Backend py_compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: compile all api/ + crawler 핵심
        working-directory: backend
        run: |
          python -m compileall -q api/
          python -m py_compile crawler/scheduler.py crawler/naver_crawler.py
